services:
  - type: web
    name: pincode-cloud
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: PINCODE_DATABASE
        value: pincode
      - key: PINCODE_SECRET
        sync: false
      - key: PINCODE_ALLOWED_ORIGINS
        value: http://localhost:1420,http://127.0.0.1:1420,http://localhost:5173
