name: Build PinCode for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "src-tauri/**"
      - "package.json"
      - "vite.config.js"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install WebView2
        uses: microsoft/setup-msbuild@v2
      - name: Install frontend dependencies
        run: npm install
      - name: Generate Windows application icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path "src-tauri/icons" | Out-Null
          $bitmap = New-Object System.Drawing.Bitmap 64, 64
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $graphics.Clear([System.Drawing.Color]::FromArgb(20, 24, 36))
          $brush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(93, 214, 190))
          $font = New-Object System.Drawing.Font "Arial", 38, ([System.Drawing.FontStyle]::Bold), ([System.Drawing.GraphicsUnit]::Pixel)
          $graphics.DrawString("P", $font, $brush, 9, 5)
          $iconHandle = $bitmap.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($iconHandle)
          $stream = [System.IO.File]::Create("src-tauri/icons/icon.ico")
          $icon.Save($stream)
          $stream.Dispose()
          $icon.Dispose()
          $graphics.Dispose()
          $bitmap.Dispose()
          $font.Dispose()
          $brush.Dispose()
      - name: Build Windows installers
        run: npm run tauri -- build
      - name: Upload MSI and EXE installers
        uses: actions/upload-artifact@v4
        with:
          name: PinCode-Windows-Installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
